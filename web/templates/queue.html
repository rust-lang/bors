{% extends "base.html" %}

{% block title %}Bors queue - {{ data.repo_name }} {% if data.tree_closed.is_some() %} [TREECLOSED] {% endif %}{% endblock %}

{% block viewport %}
<meta name="viewport" content="width=1280, initial-scale=0.5"/>
{% endblock %}

{% block head %}
<!--
  Parsing large data is faster when it's done via JSON.parse of a string, rather than outputting the raw JS
  directly. So we store it in a JSON script section, and then parse it as JSON in the browser.
-->
<script type="application/json" id="queue-data">{{ data | json | safe }}</script>
<link href="/assets/vue/{{ queue_css_path }}" rel="stylesheet">
<script type="text/javascript" src="/assets/vue/{{ queue_js_path }}"></script>
{% endblock %}

{% block body %}
<main>
  <div id="queue-app"></div>

  <div style="text-align: center; margin-top: 1em;">
    <a href="https://github.com/rust-lang/bors">Contribute on GitHub</a>
  </div>
</main>
{% endblock %}
